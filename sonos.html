<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data: blob:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>Sonos Collection · Artistic Smart Homes</title>
<style>/* Artistic Smart Homes · client portal v2 · Swiss private-bank house style */
:root{
  --paper:#F6F3EC; --paper2:#EFEBE2; --white:#FBFAF6; --ink:#15171A; --ink2:#2E3136; --deep:#1B2430;
  --muted:#6C6860; --faint:#9A958B; --rule:#E2DCCF; --rule2:#CFC7B7; --gold:#9C7F52; --gold2:#B89A6A;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:84px;-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font:400 15px/1.65 var(--sans);font-variant-numeric:tabular-nums lining-nums;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.wrap{max-width:1240px;margin:0 auto;padding:0 48px}
h1,h2,h3{font-family:var(--serif);font-weight:400;letter-spacing:-.005em}
.eyebrow,.kicker,.fl,.ledger-h,.lbl,.dw-l,.nav a,.tt span,.items th{font:500 10.5px/1.4 var(--sans);letter-spacing:.18em;text-transform:uppercase}
:focus-visible{outline:1px solid var(--gold);outline-offset:3px}

/* gate */
.gate{min-height:100vh;display:grid;place-items:center;padding:32px;background:var(--paper)}
.gate-card{width:100%;max-width:420px;text-align:center}
.gate-logo{width:220px;margin:0 auto 56px}
.gate-h{font-family:var(--serif);font-weight:400;font-size:34px;line-height:1.15;margin-bottom:14px}
.gate-p{color:var(--muted);font-size:14px;margin-bottom:40px}
#gate-form{display:grid;gap:14px}
#pw{width:100%;padding:14px 2px;border:0;border-bottom:1px solid var(--rule2);background:transparent;font:400 17px var(--serif);letter-spacing:.08em;text-align:center;color:var(--ink);border-radius:0}
#pw:focus{outline:0;border-bottom-color:var(--ink)}
#gate-btn{margin-top:18px;padding:15px;background:var(--deep);color:var(--white);font:500 11px var(--sans);letter-spacing:.22em;text-transform:uppercase;transition:background .3s}
#gate-btn:hover{background:var(--ink)}
.gate-err{min-height:20px;color:#8A3B2E;font-size:13px}
.gate-foot{margin-top:48px;color:var(--faint);font-size:11.5px;letter-spacing:.04em}
.gate-foot::before{content:"";display:block;width:32px;height:1px;background:var(--gold);margin:0 auto 18px}

/* top bar */
.top{position:fixed;inset:0 0 auto;z-index:40;background:rgba(246,243,236,.94);backdrop-filter:saturate(1.2) blur(10px);-webkit-backdrop-filter:saturate(1.2) blur(10px);border-bottom:1px solid var(--rule)}
.top-in{max-width:1340px;margin:0 auto;padding:0 48px;height:68px;display:flex;align-items:center;gap:40px}
.brand img{height:26px;width:auto}
.nav{display:flex;gap:34px;margin-left:auto}
.nav a{text-decoration:none;color:var(--ink2);padding:6px 0;border-bottom:1px solid transparent;transition:border-color .3s,color .3s}
.nav a:hover{border-bottom-color:var(--gold);color:var(--ink)}
.tt{display:flex;flex-direction:column;align-items:flex-end;text-decoration:none;padding-left:34px;border-left:1px solid var(--rule)}
.tt span{color:var(--faint);font-size:9.5px}
.tt strong{font:400 17px/1.2 var(--serif)}

/* hero */
.hero{position:relative;height:min(92vh,980px);min-height:560px;overflow:hidden;background:var(--deep);color:var(--white)}
.hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 55%;animation:settle 2.4s var(--ease) both}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(14,17,22,.72) 0%,rgba(14,17,22,.42) 42%,rgba(14,17,22,.08) 75%),linear-gradient(0deg,rgba(14,17,22,.45),rgba(14,17,22,0) 40%)}
@keyframes settle{from{transform:scale(1.04);opacity:.6}to{transform:none;opacity:1}}
.hero-in{position:absolute;z-index:2;left:max(48px,calc((100vw - 1240px)/2 + 48px));bottom:15%;max-width:640px}
.kicker{color:rgba(251,250,246,.86);display:flex;align-items:center;gap:16px;margin-bottom:28px}
.kicker .sep{width:36px;height:1px;background:var(--gold2)}
.hero h1{font-size:clamp(56px,8.4vw,124px);line-height:.98;letter-spacing:-.02em;margin-bottom:28px}
.hero-sub{font:400 19px/1.55 var(--serif);color:rgba(251,250,246,.88);max-width:520px}
.hero-cap{position:absolute;z-index:2;right:48px;bottom:28px;font-size:11px;letter-spacing:.06em;color:rgba(251,250,246,.62)}

/* figures */
.figs{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--rule)}
.figs>div{padding:40px 28px 38px 0;border-right:1px solid var(--rule)}
.figs>div+div{padding-left:28px}
.figs>div:last-child{border-right:0}
.fl{color:var(--muted);margin-bottom:12px}
.fv{font:400 30px/1.15 var(--serif);letter-spacing:-.01em}
.figs .acc .fl{color:var(--gold)}

/* letter */
.letter{max-width:760px;padding-top:110px;padding-bottom:40px}
.letter p{font:400 21px/1.62 var(--serif);color:var(--ink2);margin-bottom:22px}
.letter .dateline{font:500 10.5px var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-bottom:34px}
.letter .sig{font:italic 400 17px var(--serif);color:var(--muted);margin-top:34px}

/* sections */
.sec{padding-top:120px;padding-bottom:40px}
.sec-h{display:grid;grid-template-columns:96px 1fr;align-items:start;padding-bottom:30px;margin-bottom:56px;border-bottom:1px solid var(--ink)}
.num{font:400 22px/1.3 var(--serif);color:var(--gold);padding-top:8px}
.sec-h h2{font-size:clamp(34px,4vw,52px);line-height:1.08;margin-bottom:16px}
.sec-p{color:var(--muted);max-width:640px;font-size:15.5px}

/* summary */
.exec{display:grid;grid-template-columns:1fr 380px;gap:88px;align-items:start}
.chart{list-style:none}
.bar{display:grid;grid-template-columns:minmax(150px,230px) 1fr 104px 52px;gap:20px;align-items:center;padding:13px 0;border-bottom:1px solid var(--rule);transition:opacity .4s}
.bn{font:400 15px var(--serif)}
.bt{height:1px;background:var(--rule);position:relative}
.bf{position:absolute;left:0;top:-1px;height:3px;background:var(--deep);transition:background .4s}
.bv{text-align:right;font-size:14px}
.bp{text-align:right;color:var(--faint);font-size:12.5px}
.bar.off{opacity:.32}
.ledger,.totals{border-top:1px solid var(--ink)}
.ledger-h{color:var(--gold);padding:18px 0 8px}
.ledger dl div,.totals dl div{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--rule);font-size:14.5px}
.ledger dt,.totals dt{color:var(--ink2)}
.ledger .rule,.totals .rule{border-top:1px solid var(--rule2)}
.ledger .grand,.totals .grand{border-bottom:1px solid var(--ink);padding:18px 0}
.grand dt{font:400 18px var(--serif);color:var(--ink)}
.grand dd{font:400 26px/1.1 var(--serif);letter-spacing:-.01em}
.ledger-n{color:var(--faint);font-size:12.5px;margin-top:16px}

/* plates (full-bleed photography) */
.plate{position:relative;margin:120px 0 0;background:var(--paper)}
.plate img{width:100%;height:min(78vh,820px);object-fit:cover}
.plate.short img{height:min(56vh,560px)}
.plate figcaption{max-width:1240px;margin:0 auto;padding:14px 48px 0;font-size:11.5px;letter-spacing:.04em;color:var(--muted)}

/* builder */
.builder{display:grid;grid-template-columns:1fr 340px;gap:72px;align-items:start}
.cards{display:grid}
.sys{border-top:1px solid var(--rule2);padding:34px 0 30px;transition:opacity .45s var(--ease)}
.sys:first-child{border-top:0;padding-top:0}
.sys-head{display:grid;grid-template-columns:56px 1fr auto;gap:8px;align-items:start}
.sys-n{font:400 16px/1.9 var(--serif);color:var(--gold)}
.sys-t .eyebrow{color:var(--muted);margin-bottom:6px}
.sys h3{font-size:28px;line-height:1.15}
.sect{color:var(--faint);font-size:13.5px;margin-top:4px}
.sys-r{display:flex;flex-direction:column;align-items:flex-end;gap:14px}
.sys-p{font:400 22px/1.2 var(--serif)}
.sys-body{padding-left:64px;margin-top:22px}
.items{width:100%;border-collapse:collapse}
.items th{text-align:left;color:var(--faint);font-size:9.5px;padding:0 0 10px;border-bottom:1px solid var(--rule)}
.items td{padding:0;border-bottom:1px solid var(--rule);vertical-align:top;font-size:14.5px}
.items td.q{width:56px;padding:13px 0;color:var(--muted)}
.items td.d{padding:0}
.items td.d>.pd{display:block;padding:13px 0}
.items td.m{width:150px;text-align:right;padding:13px 0;color:var(--muted);font-size:12px;letter-spacing:.06em}
.items th:last-child{text-align:right}
.prod{display:flex;width:100%;align-items:baseline;justify-content:space-between;gap:16px;padding:13px 16px 13px 0;text-align:left}
.prod .pd{border-bottom:1px solid transparent;transition:border-color .3s}
.prod .pm{flex:none;display:inline-flex;align-items:center;gap:8px;font:500 9.5px var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--gold);opacity:.8;transition:opacity .3s,gap .3s}
.prod .ar{width:16px;height:8px}
.prod:hover .pd{border-bottom-color:var(--ink)}
.prod:hover .pm{opacity:1;gap:12px}
.subl{list-style:none;color:var(--muted);font-size:13px;padding:0 0 12px}
.subl li::before{content:"";display:inline-block;width:10px;height:1px;background:var(--rule2);vertical-align:middle;margin-right:10px}
.incl{list-style:none;margin-top:18px;display:flex;flex-wrap:wrap;gap:6px 26px;color:var(--ink2);font-size:13.5px}
.incl li::before{content:"";display:inline-block;width:5px;height:5px;border:1px solid var(--gold);border-radius:50%;margin-right:10px;vertical-align:1px}
.zones{margin-top:14px;font:400 14.5px var(--serif);color:var(--ink2)}
.zones .lbl{color:var(--faint);margin-right:14px;font-size:9.5px}
.note{color:var(--muted);font-size:13px;margin-top:12px;font-style:italic}
.com{margin-top:16px}
.com summary{cursor:pointer;list-style:none;font:500 9.5px var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--ink2)}
.com summary::-webkit-details-marker{display:none}
.com summary::after{content:" +";color:var(--gold)}
.com[open] summary::after{content:" \2212"}
.com p{font:400 15.5px/1.65 var(--serif);color:var(--ink2);margin-top:12px;max-width:680px}
.sys.off{opacity:.38}
.sys.off .sys-p{text-decoration:line-through;text-decoration-thickness:1px}

/* toggle */
.tog{display:inline-flex;align-items:center;gap:12px;cursor:pointer;user-select:none}
.tog input{position:absolute;opacity:0;width:1px;height:1px}
.track{width:38px;height:20px;border:1px solid var(--ink2);border-radius:20px;position:relative;transition:background .35s var(--ease),border-color .35s}
.knob{position:absolute;top:3px;left:3px;width:12px;height:12px;border-radius:50%;background:var(--ink2);transition:transform .35s var(--ease),background .35s}
.tog input:checked+.track{background:var(--deep);border-color:var(--deep)}
.tog input:checked+.track .knob{transform:translateX(18px);background:var(--white)}
.tog input:focus-visible+.track{outline:1px solid var(--gold);outline-offset:3px}
.tog-l{font:500 9.5px var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--muted);width:62px}
.stepper{display:flex;align-items:center;border:1px solid var(--rule2)}
.stepper button{width:34px;height:32px;font-size:16px;color:var(--ink2)}
.stepper button:hover{background:var(--paper2)}
.stepper output{min-width:34px;text-align:center;font:400 16px var(--serif);border-left:1px solid var(--rule2);border-right:1px solid var(--rule2);line-height:32px}

/* totals */
.totals{position:sticky;top:96px}
.selcount{color:var(--muted);font-size:13px;margin-bottom:6px}
.est{color:var(--muted);font-size:12.5px;font-style:italic;margin-top:14px}
.btn{display:inline-block;text-decoration:none;font:500 10.5px var(--sans);letter-spacing:.2em;text-transform:uppercase;padding:16px 26px;transition:background .3s,color .3s}
.btn.solid{background:var(--deep);color:var(--white)}
.btn.solid:hover{background:var(--ink)}
.btn.wide{width:100%;margin-top:26px}
.btn.link{padding:14px 0;color:var(--muted);letter-spacing:.14em}
.btn.link:hover{color:var(--ink)}
.btn.inv{color:rgba(251,250,246,.7);padding:0}

/* rooms */
.rx-floors{display:flex;gap:40px;border-bottom:1px solid var(--rule);margin-bottom:40px;overflow-x:auto}
.rx-floors button{padding:0 0 14px;font:400 19px var(--serif);color:var(--faint);border-bottom:1px solid transparent;margin-bottom:-1px;white-space:nowrap;transition:color .3s}
.rx-floors button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--gold)}
.rx-main{display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:start}
.rx-pic img{width:100%;aspect-ratio:4/3;object-fit:cover}
.rx-pic figcaption{font-size:11.5px;letter-spacing:.04em;color:var(--muted);padding-top:12px}
.rx-rooms{display:flex;flex-wrap:wrap;border-top:1px solid var(--rule)}
.rx-rooms button{width:50%;display:flex;justify-content:space-between;padding:12px 18px 12px 0;border-bottom:1px solid var(--rule);font:400 16px var(--serif);text-align:left;color:var(--ink2)}
.rx-rooms button:nth-child(even){padding-left:18px;border-left:1px solid var(--rule)}
.rx-rooms button span{color:var(--faint);font:400 13px var(--sans)}
.rx-rooms button[aria-pressed=true]{color:var(--ink)}
.rx-rooms button[aria-pressed=true] span{color:var(--gold)}
.rx-detail{margin-top:34px}
.rx-h{font:400 28px var(--serif);margin-bottom:18px}
.rx-h span{display:block;font:500 9.5px var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-top:6px}
.cnts{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--ink);border-bottom:1px solid var(--rule)}
.cnt{padding:14px 0;text-align:center;border-right:1px solid var(--rule)}
.cnt:last-child{border-right:0}
.cnt strong{display:block;font:400 26px/1.1 var(--serif)}
.cnt span{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.cnt.zero strong{color:var(--rule2)}
.rx-sum{margin-top:22px;font-size:13px;color:var(--muted)}
.rx-sum p{display:flex;flex-wrap:wrap;gap:4px 16px;padding:8px 0;border-bottom:1px solid var(--rule)}
.rx-sum span{width:100%;font:500 9.5px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.rx-sum b{font-weight:400;color:var(--ink)}
.rx-sum i{font-style:normal;color:var(--faint);margin-left:4px}
.rx-all{margin-top:44px;border-top:1px solid var(--rule)}
.rx-all summary{cursor:pointer;padding:18px 0;list-style:none;font:500 10px var(--sans);letter-spacing:.18em;text-transform:uppercase}
.rx-all summary::-webkit-details-marker{display:none}
.rx-all summary::after{content:" +";color:var(--gold)}
.tbl-scroll{overflow-x:auto}
.sched{width:100%;border-collapse:collapse;font-size:13.5px}
.sched th,.sched td{padding:9px 10px;border-bottom:1px solid var(--rule);text-align:center}
.sched tbody th{text-align:left;font:400 14.5px var(--serif)}
.sched thead th{font:500 9.5px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.sched .fl th{font:500 9.5px var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--gold);padding-top:22px}
.sched .tp th,.sched .tp td{border-top:1px solid var(--ink);font-family:var(--serif);font-size:16px}

/* document */
.doc{display:flex;justify-content:space-between;align-items:center;gap:30px;padding:30px 0;border-bottom:1px solid var(--rule)}
.doc-t{font:400 22px var(--serif)}
.doc-m{color:var(--muted);font-size:13px;margin-top:4px}

/* gallery */
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
.gallery img{width:100%;aspect-ratio:4/5;object-fit:cover}
.gallery figcaption{font-size:11.5px;letter-spacing:.04em;color:var(--muted);padding-top:10px}

/* footer */
.foot{margin-top:140px;background:var(--deep);color:rgba(251,250,246,.78);padding:80px 0 64px}
.foot-in{display:grid;grid-template-columns:260px 1fr;gap:20px 60px;align-items:start}
.foot img{width:200px;opacity:.92}
.foot p{font-size:13.5px;line-height:1.8}
.foot a{color:var(--white);text-decoration:none;border-bottom:1px solid rgba(184,154,106,.5)}
.foot-s{grid-column:1/-1;margin-top:40px;padding-top:22px;border-top:1px solid rgba(251,250,246,.14);font-size:11.5px!important;color:rgba(251,250,246,.5)}
.mbar{display:none}

/* product drawer */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(21,23,26,.36);opacity:0;transition:opacity .35s var(--ease)}
.drawer{position:fixed;z-index:61;top:0;right:0;bottom:0;width:min(520px,100vw);background:var(--white);border-left:1px solid var(--rule2);overflow-y:auto;transform:translateX(100%);transition:transform .42s var(--ease);overscroll-behavior:contain}
body.dw-open .scrim{opacity:1}
body.dw-open .drawer{transform:none}
.dw-x{position:sticky;top:0;display:flex;margin-left:auto;align-items:center;gap:10px;padding:22px 30px;font:500 9.5px var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--muted);background:var(--white);z-index:2}
.dw-x span{font:300 22px/1 var(--sans);letter-spacing:0}
.dw-x:hover{color:var(--ink)}
.dw-in{padding:0 44px 56px}
.dw-pic{height:300px;display:grid;place-items:center;background:#fff;border:1px solid var(--rule);margin-bottom:34px;padding:28px}
.dw-pic img{max-height:244px;max-width:100%;object-fit:contain}
.dw-pic.empty{background:var(--paper)}
.dw-pic.empty span{font:400 26px var(--serif);color:var(--faint);letter-spacing:.04em}
.dw-in .eyebrow{color:var(--gold);margin-bottom:10px}
.dw-in h3{font-size:31px;line-height:1.15;margin-bottom:16px}
.dw-purpose{font:400 18px/1.55 var(--serif);color:var(--ink2);margin-bottom:34px}
.dw-l{color:var(--muted);padding-bottom:10px;border-bottom:1px solid var(--ink);margin-top:30px}
.uses{list-style:none}
.uses li{display:grid;grid-template-columns:68px 1fr;padding:12px 0;border-bottom:1px solid var(--rule);font-size:14px}
.uq{font:400 20px/1.2 var(--serif)}
.uses i{display:block;font-style:normal;color:var(--faint);font-size:12px;margin-top:2px}
.specs div{display:grid;grid-template-columns:136px 1fr;gap:16px;padding:13px 0;border-bottom:1px solid var(--rule)}
.specs dt{font:500 9.5px/1.9 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.specs dd{font-size:14.5px;line-height:1.5}
.specs dd a{display:inline-block;margin-left:10px;font-size:10px;letter-spacing:.08em;color:var(--gold);text-decoration:none;border-bottom:1px solid rgba(156,127,82,.35);vertical-align:1px}
.specs dd a:hover{border-bottom-color:var(--gold)}
.dw-none{color:var(--muted);font-size:14px;padding:14px 0;border-bottom:1px solid var(--rule)}
.dw-src{margin-top:26px;font-size:11.5px;color:var(--muted);display:grid;gap:4px}
.dw-src span{font:500 9.5px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.dw-src a{color:var(--muted)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}

@media (max-width:1080px){
  .wrap{padding:0 32px}.top-in{padding:0 32px;gap:24px}.nav{gap:22px}
  .exec{grid-template-columns:1fr;gap:56px}
  .builder{grid-template-columns:1fr;gap:56px}
  .totals{position:static}
  .rx-main{grid-template-columns:1fr;gap:40px}
}
@media (max-width:720px){
  body{font-size:14.5px}
  .wrap{padding:0 22px}
  .top-in{padding:0 22px;height:58px}
  .brand img{height:20px}
  .nav{display:flex;gap:0;margin-left:auto}.nav a:not(.nav-x){display:none}.nav a.nav-x{font-size:9.5px;letter-spacing:.14em}
  .tt{margin-left:18px!important}
  .tt{margin-left:auto;padding-left:0;border-left:0}
  .tt strong{font-size:15px}

@media (hover:hover){.fp-room:hover .fp-r{fill:var(--paper)}.fp-room:hover .fp-n{fill:var(--ink)}.fp-ap:hover .fp-apo{fill:var(--paper)}.fp-per:hover .fp-pl{stroke:var(--gold)}}
.fp-room:focus-visible .fp-r,.fp-room:focus-visible .fp-apo,.fp-per:focus-visible .fp-pl{stroke:var(--gold);stroke-width:2}

.fp-room.on .fp-n{fill:var(--ink)}

.fp-tot{color:var(--muted);font-size:14px}

.fp-pulls li{grid-template-columns:52px 1fr;align-items:start}

/* sign-off */
.sg{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:72px;align-items:start}

.sg-sig{padding-top:16px}
.sg-sh{display:flex;justify-content:space-between;align-items:center}

.sg-pad{position:relative;margin-top:6px;height:150px;background:var(--white);border:1px solid var(--rule2)}

.sg-pad::after{content:"";position:absolute;left:34px;right:22px;bottom:34px;height:1px;background:var(--rule2);pointer-events:none}

.sg-chk input{position:absolute;opacity:0;width:1px;height:1px}
.sg-box{flex:none;width:18px;height:18px;border:1px solid var(--ink2);position:relative;transition:background .3s}
.sg-chk input:checked+.sg-box{background:var(--deep);border-color:var(--deep)}
.sg-chk input:checked+.sg-box::after{content:"";position:absolute;left:5px;top:1px;width:5px;height:10px;border:solid var(--white);border-width:0 1.5px 1.5px 0;transform:rotate(45deg)}
.sg-chk input:focus-visible+.sg-box{outline:1px solid var(--gold);outline-offset:3px}
.btn.solid:disabled{background:var(--rule2);color:var(--white);cursor:not-allowed}
.sg-need{min-height:20px;margin-top:10px;font-size:12.5px;color:var(--muted)}

.sg-links{display:flex;flex-wrap:wrap;gap:8px 26px;margin-top:12px}
.sg-links a{font:500 9.5px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--gold);text-decoration:none;border-bottom:1px solid rgba(156,127,82,.35);padding-bottom:2px}
@media (max-width:1080px){

.sg-g{display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin-top:22px;padding:14px 0;border-top:1px solid var(--rule2);border-bottom:1px solid var(--ink)}

/* ---------------- Sonos Collection ---------------- */
.nav a.on{border-bottom-color:var(--gold);color:var(--ink)}
.sn{padding-top:68px}
.sn-intro{padding-top:120px;padding-bottom:56px;max-width:1240px}

.sn-sec{padding-top:56px;padding-bottom:40px}
.sn-h{display:grid;grid-template-columns:96px 1fr;align-items:start;padding-bottom:30px;margin-bottom:0;border-bottom:1px solid var(--ink)}
.sn-h h2{font-size:clamp(34px,4vw,52px);line-height:1.08;margin-bottom:16px}

.sn-cat{font:500 10.5px/1.4 var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}

.sn-arr{color:var(--gold);transition:transform .4s var(--ease)}
@media (hover:hover){.sn-card:hover{background:var(--white)}.sn-card:hover .sn-ph img{transform:scale(1.035)}.sn-card:hover .sn-arr{transform:translateX(4px)}}

/* viewer */
html.sv-lock{overflow:hidden}
.sv{position:fixed;inset:0;z-index:80;background:var(--paper);display:flex;flex-direction:column;opacity:0;transition:opacity .35s var(--ease)}
.sv.in{opacity:1}
.sv-bar{display:flex;align-items:baseline;gap:22px;padding:22px 48px 18px;border-bottom:1px solid var(--rule)}
.sv-bar .eyebrow{color:var(--gold)}
.sv-bar h2{font-size:30px;line-height:1.1}
.sv-x{margin-left:auto;font:500 10.5px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;padding:12px 0 12px 18px;border-left:1px solid var(--rule);min-height:44px}
.sv-x:hover{color:var(--gold)}
.sv-body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.55fr) minmax(340px,1fr)}
.sv-stage{position:relative;overflow:hidden;border-right:1px solid var(--rule);cursor:pointer;-webkit-tap-highlight-color:transparent}
.sv-panel{overflow-y:auto;padding:34px 48px 60px 40px;-webkit-overflow-scrolling:touch}
.sx{position:absolute;inset:0}
.sx-tag{position:absolute;left:28px;bottom:22px;font:500 9.5px/1.4 var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--faint)}
.sx-photo{position:absolute;left:50%;top:50%;width:min(72%,620px);height:auto;max-height:78%;object-fit:contain;transform:translate(-50%,-50%);transform-origin:0 0;transition:transform 1.1s var(--ease),opacity .8s var(--ease),width 1.1s var(--ease)}
/* schematic */
.sx-scene{position:absolute;inset:0;display:grid;place-items:center;perspective:2200px}
.sx-fit{transform:scale(var(--s,1));transform-style:preserve-3d;width:0;height:0}
.sx-stack{position:relative;width:0;height:0;transform-style:preserve-3d;transform:rotateX(58deg) rotateZ(-34deg)}
.sx-layer{position:absolute;left:0;top:0;color:var(--ink);background:rgba(251,250,246,.86);border:1px solid var(--ink2);opacity:0;
  transform:translateZ(calc(var(--i) * 2px));transition:transform 1.25s var(--ease) calc(var(--d) * 75ms + 120ms),opacity .7s var(--ease) calc(var(--d) * 40ms),border-color .3s,background .3s,color .3s}
.sx-layer svg{display:block;width:100%;height:100%;overflow:visible}
.sx-n{position:absolute;left:-1px;top:-1px;transform:translateY(-100%);font:400 15px/1 var(--serif);padding:4px 8px 3px;border:1px solid var(--ink2);border-bottom:0;background:var(--white)}
.sv-stage.open .sx-layer{opacity:1;transform:translateZ(calc((var(--i) - (var(--N) - 1) / 2) * var(--gap,56px)))}
.sv-stage.open.sx-dia-on .sx-layer{opacity:1}
.sx-dia .sx-photo{transition:left 1.1s var(--ease),top 1.1s var(--ease),width 1.1s var(--ease),transform 1.1s var(--ease),opacity .8s}
.sv-stage.open .sx-dia .sx-photo{left:28px;top:24px;width:min(18%,150px);transform:none;opacity:.95}
.sv-stage.focus .sx-layer{opacity:.28}
.sv-stage.focus .sx-layer.hi{opacity:1;color:var(--gold);border-color:var(--gold);background:var(--white)}
/* official exploded */
.sx-exp{position:absolute;left:50%;top:50%;width:min(88%,980px);height:auto;max-height:84%;object-fit:contain;transform:translate(-50%,-50%) scale(.9);opacity:0;clip-path:inset(0 0 0 62%);
  transition:transform 1.4s var(--ease) .15s,opacity .7s var(--ease) .1s,clip-path 1.5s var(--ease) .1s}
.sv-stage.open .sx-off .sx-photo{transform:translate(-50%,-50%) translateX(14%) scale(.86);opacity:0}
.sv-stage.open .sx-exp{transform:translate(-50%,-50%);opacity:1;clip-path:inset(0)}
/* official layered reveal: grille lifts away from the baffle */
.sx-baf,.sx-gri{position:absolute;left:50%;top:50%;width:min(46%,430px);max-height:72%;height:auto;object-fit:contain;transform:translate(-50%,-50%);opacity:0;transition:transform 1.4s var(--ease) .15s,opacity .7s var(--ease)}
.sx-rev .sx-photo{transition:transform 1s var(--ease),opacity .7s var(--ease)}
.sv-stage.open .sx-rev .sx-photo{opacity:0;transform:translate(-50%,-50%) scale(.9)}
.sv-stage.open .sx-baf{opacity:1;transform:translate(-50%,-50%) translateX(26%) scale(.86)}
.sv-stage.open .sx-gri{opacity:1;transform:translate(-50%,-50%) translate(-30%,-4%) scale(.86) rotate(-3deg)}
.sv:focus{outline:0}
/* panel */
.sv-line{font:400 20px/1.55 var(--serif);color:var(--ink2);margin-bottom:24px}
.sv-tog{display:inline-flex;align-items:center;gap:12px;min-height:44px;padding:0 22px;background:var(--deep);color:var(--white);font:500 10.5px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;margin-bottom:40px;transition:background .3s}
.sv-tog:hover{background:var(--ink)}
.sv-tog .t-close,.sv-tog.on .t-open{display:none}.sv-tog.on .t-close{display:inline}
.sv-h{font:500 10.5px/1.4 var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--gold);padding-bottom:12px;border-bottom:1px solid var(--ink);margin-bottom:6px}
.sv-parts{list-style:none;margin-bottom:44px}
.sv-parts li{display:grid;grid-template-columns:34px 1fr;gap:6px;padding:15px 0;border-bottom:1px solid var(--rule);outline-offset:-1px;transition:background .3s}
.sv-parts li:hover,.sv-parts li:focus{background:var(--white)}
.sv-pn{font:400 18px/1.3 var(--serif);color:var(--gold)}
.sv-pt{font:400 17px/1.35 var(--serif);margin-bottom:3px}
.sv-pd{color:var(--muted);font-size:13.5px;line-height:1.55;margin-bottom:4px}
.sv-src,.sv-srcline a{font-size:11px;letter-spacing:.04em;color:var(--faint);text-underline-offset:3px;text-decoration-color:var(--rule2)}
.sv-src:hover,.sv-srcline a:hover{color:var(--gold)}
.sv-fig{margin:-16px 0 44px}.sv-fig img{width:100%;height:auto;background:var(--white)}.sv-fig figcaption{font-size:11px;color:var(--faint);padding-top:8px}
.sv-specs div{display:grid;grid-template-columns:130px 1fr;gap:16px;padding:12px 0;border-bottom:1px solid var(--rule)}
.sv-specs dt{font:500 10px/1.6 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.sv-specs dd{font:400 15px/1.45 var(--serif)}
.sv-srcline{margin-top:14px;font-size:11px;color:var(--faint)}
.sv-opt{margin-top:26px;padding-top:14px;border-top:1px solid var(--rule);font-size:12px;color:var(--muted)}

@media (max-width:1080px){.sn-grid{grid-template-columns:repeat(2,1fr)}.sv-bar{padding:18px 32px 14px}.sv-panel{padding:28px 32px 56px}}
@media (max-width:720px){
  .sn-nav{display:flex;margin-left:auto}.sn-nav a.on{display:none!important}.sn-nav a:first-child{display:inline-block!important;font-size:9.5px;letter-spacing:.14em}
  .sn-intro{padding-top:76px;padding-bottom:40px}.sn-intro h1{font-size:54px}.sn-lede{font-size:18px}
  .sn-h{grid-template-columns:1fr;gap:6px}
  .sn-grid{grid-template-columns:1fr}
  .sn-card{padding:26px 4px 24px}.sn-ph{aspect-ratio:4/3}.sn-name{font-size:28px}
  .sv-bar{padding:14px 20px 12px;gap:14px}.sv-bar .eyebrow{display:none}.sv-bar h2{font-size:24px}
  .sv-body{display:block;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .sv-stage{height:58vh;min-height:360px;border-right:0;border-bottom:1px solid var(--rule)}
  .sv-panel{overflow:visible;padding:26px 22px 60px}
  .sx-tag{left:16px;bottom:12px;font-size:8.5px}
  .sv-stage.open .sx-dia .sx-photo{left:14px;top:12px;width:76px}
  .sv-specs div{grid-template-columns:108px 1fr;gap:12px}
}
@media (prefers-reduced-motion:reduce){.sx-layer,.sx-photo,.sx-exp,.sv{transition:none!important}}
</style>

<script>"use strict";
/* Sonos Collection: separate encrypted page sharing the portal's key (same salt -> same session key). */
const META = JSON.parse(document.getElementById("meta").textContent);
const te = new TextEncoder();
const AAD = te.encode("ash-portal/v" + META.v);
const SS_KEY = "ashp.k." + META.salt.slice(0, 8);
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const b64ToBytes = b => Uint8Array.from(atob(b.replace(/\s+/g, "")), c => c.charCodeAt(0));
const bytesToB64 = u => { let s = ""; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); };
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

async function deriveKey(pw) {
  const base = await crypto.subtle.importKey("raw", te.encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", hash: "SHA-256", salt: b64ToBytes(META.salt), iterations: META.iter }, base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
}
async function decryptWith(key) {
  const c = b64ToBytes(document.getElementById("payload").textContent);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64ToBytes(META.iv), additionalData: AAD, tagLength: 128 }, key, c);
  return JSON.parse(new TextDecoder().decode(plain));
}
async function tryResume() {
  const raw = sessionStorage.getItem(SS_KEY); if (!raw) return false;
  try { const k = await crypto.subtle.importKey("raw", b64ToBytes(raw), "AES-GCM", false, ["decrypt"]); open(await decryptWith(k)); return true; }
  catch (e) { sessionStorage.removeItem(SS_KEY); return false; }
}
$("#gate-form").addEventListener("submit", async ev => {
  ev.preventDefault();
  const err = $("#gate-err"), btn = $("#gate-btn"), val = $("#pw").value;
  if (!window.crypto || !crypto.subtle) { err.textContent = "This browser cannot decrypt the portal. Please use a current browser."; return; }
  err.textContent = ""; btn.disabled = true; btn.textContent = "Opening…";
  try {
    const key = await deriveKey(val); const res = await decryptWith(key);
    sessionStorage.setItem(SS_KEY, bytesToB64(new Uint8Array(await crypto.subtle.exportKey("raw", key))));
    open(res);
  } catch (e) { err.textContent = "That access code didn't work. Please try again."; btn.disabled = false; btn.textContent = "Open"; }
});
tryResume();

/* ---------------- page ---------------- */
let S, SET, cur = null, lastFocus = null;
const srcset = k => SET[k].map(([w, u]) => u + " " + w + "w").join(", ");
const pic = (k, sizes) => `src="${SET[k][Math.min(1, SET[k].length - 1)][1]}" srcset="${srcset(k)}" sizes="${sizes}" width="${SET[k][SET[k].length - 1][0]}" height="${Math.round(SET[k][SET[k].length - 1][0] * SET[k + ":h"])}"`;

function open(p) {
  S = p.sonos; SET = p.imgset;
  document.title = "Sonos Collection · " + p.provider;
  $("#gate").remove();
  const app = $("#app"); app.hidden = false;
  app.innerHTML = render(p);
  wire();
  const h = location.hash.slice(1); if (h && S.products.some(x => x.id === h)) viewer(h, true);
}

function render(p) {
  const nOff = S.products.filter(x => x.mode !== "diagram").length;
  const cards = S.products.map((x, i) => `
    <li><button class="sn-card" data-id="${x.id}" aria-haspopup="dialog">
      <span class="sn-ph"><img ${pic(x.img, "(max-width:720px) 80vw, 26vw")} alt="Sonos ${esc(x.name)}" loading="${i < 3 ? "eager" : "lazy"}" decoding="async"></span>
      <span class="sn-cat">${esc(x.cat)}</span>
      <span class="sn-name">${esc(x.name)}</span>
      <span class="sn-line">${esc(x.line)}</span>
      <span class="sn-go"><span>${x.mode === "diagram" ? "Open the speaker" : x.mode === "official" ? "Open the official exploded view" : "Lift the grille"}</span><span class="sn-arr" aria-hidden="true">&rarr;</span></span>
    </button></li>`).join("");
  return `
<header class="top"><div class="top-in">
  <a href="index.html" class="brand"><img src="${p.logo}" alt="${esc(p.provider)}"></a>
  <nav class="nav sn-nav"><a href="index.html">Proposal</a><a href="sonos.html" class="on" aria-current="page">Sonos Collection</a></nav>
</div></header>
<main class="sn">
  <section class="sn-intro wrap">
    <p class="eyebrow sn-eye">Optional collection<span class="sep"></span>For reference</p>
    <h1>Sonos Collection</h1>
    <p class="sn-lede">A curated selection of current Sonos products for a considered home. Select a speaker to open it up and see the technology inside.</p>
    <p class="sn-note">Shown as an optional upgrade only. Nothing on this page is included in your proposal, and no prices are added to its totals.</p>
  </section>
  <section class="wrap sn-sec">
    <div class="sn-h"><span class="num">I</span><div><h2>The collection</h2><p class="sec-p">${S.products.length} products, each with verified specifications from Sonos. ${nOff ? nOff + " open up with Sonos's own photography; the others as a labelled schematic drawn from Sonos's specifications." : ""}</p></div></div>
    <ul class="sn-grid">${cards}</ul>
  </section>
  <footer class="wrap sn-foot"><p>${esc(S.verified)} Diagrams are schematic, not to scale: component counts and descriptions follow Sonos's published specifications; placement is illustrative. Product photography &copy; Sonos, Inc. Sonos and the product names are trademarks of Sonos, Inc.</p><p><a href="index.html">Return to your proposal</a></p></footer>
</main>
<div class="sv" id="sv" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="sv-name" hidden>
  <div class="sv-bar"><p class="eyebrow" id="sv-cat"></p><h2 id="sv-name"></h2><button class="sv-x" id="sv-x" aria-label="Close">Close</button></div>
  <div class="sv-body">
    <div class="sv-stage" id="sv-stage"></div>
    <aside class="sv-panel" id="sv-panel"></aside>
  </div>
</div>`;
}

/* --------- schematic drawings: counts come only from data (Sonos spec) --------- */
const DIM = { bar: [560, 120], tall: [230, 230], wide: [400, 210], era300: [360, 230], square: [300, 300] };
function grid(n, W, H, pad) { // evenly place n items
  const cols = n <= 8 ? n : Math.ceil(n / 2), rows = Math.ceil(n / cols), out = [];
  for (let i = 0; i < n; i++) { const r = Math.floor(i / cols), c = i % cols, inRow = r === rows - 1 ? n - cols * r : cols;
    out.push([pad + (W - 2 * pad) * (c + .5 + (cols - inRow) / 2) / cols, pad + (H - 2 * pad) * (r + .5) / rows]); }
  return out;
}
function drawLayer(L, W, H) {
  const n = L.n || 1, k = L.k; let g = "";
  const ink = 'stroke="currentColor" fill="none" vector-effect="non-scaling-stroke"';
  if (k === "shell") {
    g = `<defs><pattern id="pf${W}" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="4.5" cy="4.5" r="1.1" fill="currentColor" opacity=".55"/></pattern></defs>
      <rect x="6" y="6" width="${W - 12}" height="${H - 12}" rx="${Math.min(W, H) * .22}" fill="url(#pf${W})" ${ink}/>`;
  } else if (k === "tweeter" || k === "mid" || k === "woofer") {
    const pts = grid(n, W, H, 18), cell = Math.min((W - 36) / Math.min(n, n <= 8 ? n : Math.ceil(n / 2)), (H - 36) / Math.ceil(n / (n <= 8 ? n : Math.ceil(n / 2))));
    const r = Math.min(cell * .42, k === "tweeter" ? 26 : k === "mid" ? 44 : 64);
    g = pts.map(([x, y]) => k === "tweeter"
      ? `<circle cx="${x}" cy="${y}" r="${r}" ${ink}/><circle cx="${x}" cy="${y}" r="${r * .5}" fill="currentColor" opacity=".18" ${ink}/>`
      : `<circle cx="${x}" cy="${y}" r="${r}" ${ink}/><circle cx="${x}" cy="${y}" r="${r * .78}" ${ink} opacity=".6"/><circle cx="${x}" cy="${y}" r="${r * .3}" fill="currentColor" opacity=".2" ${ink}/>`).join("");
  } else if (k === "motion") {
    const m = Math.min(W * .78, 420), x0 = (W - m) / 2;
    g = `<rect x="${x0}" y="${H * .2}" width="${m}" height="${H * .24}" rx="${H * .12}" ${ink}/><rect x="${x0}" y="${H * .56}" width="${m}" height="${H * .24}" rx="${H * .12}" ${ink}/>` +
      [0, 1, 2, 3].map(i => `<rect x="${x0 + m * (.14 + i * .24) - 9}" y="${H * .5 - 9}" width="18" height="18" fill="currentColor" opacity=".22" ${ink}/>`).join("");
  } else if (k === "horn") {
    const cx = W / 2, cy = H / 2;
    g = `<path d="M${cx - W * .3} ${cy - H * .3} L${cx + W * .3} ${cy - H * .3} L${cx + W * .1} ${cy} L${cx - W * .1} ${cy} Z" ${ink}/><circle cx="${cx}" cy="${cy + H * .14}" r="${Math.min(W, H) * .12}" ${ink}/><circle cx="${cx}" cy="${cy + H * .14}" r="${Math.min(W, H) * .06}" fill="currentColor" opacity=".2" ${ink}/>`;
  } else if (k === "amp") {
    g = `<rect x="10" y="10" width="${W - 20}" height="${H - 20}" rx="3" ${ink} opacity=".7"/>` + grid(n, W, H, 22).map(([x, y]) => {
      const s = Math.max(10, Math.min(30, (W - 44) / (n <= 8 ? n : Math.ceil(n / 2)) * .5)); return `<rect x="${x - s / 2}" y="${y - s * .35}" width="${s}" height="${s * .7}" fill="currentColor" opacity=".22" ${ink}/>`; }).join("");
  } else if (k === "cpu") {
    const s = Math.min(W, H) * .32, x = W / 2 - s / 2, y = H / 2 - s / 2; let pins = "";
    for (let i = 1; i < 6; i++) { const o = s * i / 6; pins += `<path d="M${x + o} ${y} v-8 M${x + o} ${y + s} v8 M${x} ${y + o} h-8 M${x + s} ${y + o} h8" ${ink}/>`; }
    g = `<rect x="10" y="10" width="${W - 20}" height="${H - 20}" rx="3" ${ink} opacity=".7"/><rect x="${x}" y="${y}" width="${s}" height="${s}" fill="currentColor" opacity=".22" ${ink}/>${pins}`;
  } else if (k === "mic") {
    g = `<path d="M${W * .12} ${H / 2} H${W * .88}" ${ink}/><path d="M${W * .12} ${H / 2 - 8} v16 M${W * .88} ${H / 2 - 8} v16" ${ink}/>`;
  } else if (k === "io") {
    const w = (W - 40) / n;
    g = `<rect x="10" y="${H * .62}" width="${W - 20}" height="${H * .26}" rx="3" ${ink} opacity=".7"/>` + Array.from({ length: n }, (_, i) => `<rect x="${20 + w * i + w * .2}" y="${H * .68}" width="${w * .6}" height="${H * .12}" rx="2" fill="currentColor" opacity=".22" ${ink}/>`).join("");
  } else if (k === "battery") {
    g = `<rect x="${W * .2}" y="${H * .28}" width="${W * .56}" height="${H * .44}" rx="8" ${ink}/><rect x="${W * .76}" y="${H * .42}" width="${W * .05}" height="${H * .16}" fill="currentColor" ${ink}/>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" aria-hidden="true">${g}</svg>`;
}

function stageHTML(x) {
  if (x.mode === "reveal") return `
    <div class="sx sx-rev">
      <img class="sx-photo" ${pic(x.img, "(max-width:720px) 90vw, 55vw")} alt="Sonos ${esc(x.name)}">
      <img class="sx-baf" ${pic(x.baffle, "(max-width:720px) 60vw, 34vw")} alt="${esc(x.name)} with grille removed (official Sonos image)">
      <img class="sx-gri" ${pic(x.grille, "(max-width:720px) 60vw, 34vw")} alt="${esc(x.name)} grille (official Sonos image)">
      <p class="sx-tag">Official Sonos images · grille lifted away</p>
    </div>`;
  if (x.mode === "official") return `
    <div class="sx sx-off">
      <img class="sx-photo" ${pic(x.img, "(max-width:720px) 90vw, 55vw")} alt="Sonos ${esc(x.name)}">
      <img class="sx-exp" ${pic(x.exploded, "(max-width:720px) 96vw, 60vw")} alt="Exploded view of Sonos ${esc(x.name)} (official Sonos image)">
      <p class="sx-tag">Official Sonos exploded view</p>
    </div>`;
  const [W, H] = DIM[x.shape] || DIM.tall, N = x.layers.length;
  const plates = x.layers.map((L, i) => `<div class="sx-layer" data-i="${i}" style="--i:${N - 1 - i};--d:${i};width:${W}px;height:${H}px;margin:${-H / 2}px 0 0 ${-W / 2}px"><span class="sx-n">${i + 1}</span>${drawLayer(L, W, H)}</div>`).join("");
  return `
    <div class="sx sx-dia" style="--W:${W}">
      <img class="sx-photo" ${pic(x.img, "(max-width:720px) 90vw, 55vw")} alt="Sonos ${esc(x.name)}">
      <div class="sx-scene"><div class="sx-fit"><div class="sx-stack" style="--N:${N}">${plates}</div></div></div>
      <p class="sx-tag">Schematic from Sonos specifications · not to scale</p>
    </div>`;
}
function panelHTML(x) {
  return `
    <p class="sv-line">${esc(x.line)}</p>
    <button class="sv-tog" id="sv-tog" aria-pressed="false"><span class="t-open">Open it up</span><span class="t-close">Close it up</span></button>
    <h3 class="sv-h">Inside</h3>
    <ol class="sv-parts">${x.layers.map((L, i) => `<li data-i="${i}" tabindex="0"><span class="sv-pn">${i + 1}</span><div><p class="sv-pt">${esc(L.t)}</p><p class="sv-pd">${esc(L.d)}</p><a class="sv-src" href="${x.src}" target="_blank" rel="noopener noreferrer">Source: Sonos tech specs</a></div></li>`).join("")}</ol>
    ${x.detail ? `<figure class="sv-fig"><img ${pic(x.detail, "(max-width:720px) 90vw, 30vw")} alt="Woofer assembly of Sonos ${esc(x.name)} (official Sonos image)" loading="lazy"><figcaption>Woofer assembly, official Sonos image</figcaption></figure>` : ""}
    <h3 class="sv-h">Specifications</h3>
    <dl class="sv-specs">${x.specs.map(([k, v]) => `<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join("")}</dl>
    <p class="sv-srcline">Source: <a href="${x.src}" target="_blank" rel="noopener noreferrer">sonos.com, ${esc(x.name)} tech specs</a></p>
    <p class="sv-opt">Optional upgrade. Not included in the proposal or its totals.</p>`;
}

function fit() { // scale the schematic to the stage
  const st = $("#sv-stage"), f = $(".sx-fit", st); if (!f) return;
  const x = S.products.find(p => p.id === cur), [W, H] = DIM[x.shape] || DIM.tall, N = x.layers.length;
  const gap = Math.max(46, Math.min(82, 430 / N));
  const needW = W * 1.02 + H * .7, needH = H * .62 + N * gap * .86 + 60;
  const s = Math.min(1, (st.clientWidth - 40) / needW, (st.clientHeight - 90) / needH);
  f.style.setProperty("--s", s.toFixed(3)); f.style.setProperty("--gap", gap + "px");
}
function setOpen(on) {
  const st = $("#sv-stage"); st.classList.toggle("open", on);
  const t = $("#sv-tog"); if (t) { t.setAttribute("aria-pressed", on); t.classList.toggle("on", on); }
}
function viewer(id, instant) {
  const x = S.products.find(p => p.id === id); if (!x) return;
  cur = id; lastFocus = document.activeElement;
  $("#sv-cat").textContent = x.cat; $("#sv-name").textContent = x.name;
  const st = $("#sv-stage"); st.className = "sv-stage"; st.innerHTML = stageHTML(x);
  $("#sv-panel").innerHTML = panelHTML(x); $("#sv-panel").scrollTop = 0;
  const sv = $("#sv"); sv.hidden = false; document.documentElement.classList.add("sv-lock");
  requestAnimationFrame(() => { sv.classList.add("in"); fit(); });
  history.replaceState(null, "", "#" + id);
  $("#sv-tog").addEventListener("click", () => setOpen(!st.classList.contains("open")));
  $$(".sv-parts li").forEach(li => {
    const hi = on => { const l = $(`.sx-layer[data-i="${li.dataset.i}"]`, st); if (l) l.classList.toggle("hi", on); st.classList.toggle("focus", on && !!l); };
    li.addEventListener("mouseenter", () => hi(true)); li.addEventListener("mouseleave", () => hi(false));
    li.addEventListener("focus", () => hi(true)); li.addEventListener("blur", () => hi(false));
  });
  st.addEventListener("click", e => { if (!e.target.closest("a,button")) setOpen(!st.classList.contains("open")); });
  sv.focus({ preventScroll: true });
  setTimeout(() => setOpen(true), instant ? 600 : 900);
}
function closeViewer() {
  const sv = $("#sv"); sv.classList.remove("in"); document.documentElement.classList.remove("sv-lock");
  history.replaceState(null, "", location.pathname); cur = null;
  setTimeout(() => { sv.hidden = true; $("#sv-stage").innerHTML = ""; }, 320);
  if (lastFocus) lastFocus.focus({ preventScroll: true });
}
function wire() {
  $$(".sn-card").forEach(b => b.addEventListener("click", () => viewer(b.dataset.id)));
  $("#sv-x").addEventListener("click", closeViewer);
  document.addEventListener("keydown", e => {
    if ($("#sv").hidden) return;
    if (e.key === "Escape") closeViewer();
    if (e.key === "Tab") { const f = $$("#sv button, #sv a, #sv [tabindex]"); if (!f.length) return; const a = f[0], z = f[f.length - 1];
      if (e.shiftKey && document.activeElement === a) { e.preventDefault(); z.focus(); } else if (!e.shiftKey && document.activeElement === z) { e.preventDefault(); a.focus(); } }
  });
  addEventListener("resize", () => { if (cur) fit(); });
}
</script>
</body>
